name: Verify dist folder

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify-dist:
    name: Verify dist folder matches build output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and cache yarn
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Detect Aztec version
        id: aztec-version
        run: |
          AZTEC_VERSION=$(node -p "require('./package.json').config.aztecVersion")
          echo "version=$AZTEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Aztec version is $AZTEC_VERSION"

      - name: Install Aztec CLI
        run: |
          INSTALL_URL="https://install.aztec.network/${{ steps.aztec-version.outputs.version }}/"
          echo "Installing from: $INSTALL_URL"
          curl -sL $INSTALL_URL > tmp.sh
          VERSION=${{ steps.aztec-version.outputs.version }} bash tmp.sh <<< yes "yes"

      - name: Update path
        run: echo "/home/runner/.aztec/bin" >> $GITHUB_PATH

      - name: Cache Noir compilation artifacts
        id: cache-noir
        uses: actions/cache@v5
        with:
          path: |
            target/
            src/ts/artifacts/
          key: ${{ runner.os }}-noir-${{ env.AZTEC_VERSION }}-${{ hashFiles('src/nr/**/*', 'Nargo.toml') }}

      - name: Compile contracts
        if: steps.cache-noir.outputs.cache-hit != 'true'
        run: yarn compile

      - name: Generate artifacts
        if: steps.cache-noir.outputs.cache-hit != 'true'
        run: yarn codegen -f

      - name: Build package
        run: yarn build && yarn lint:prettier

      - name: Check for dist folder changes
        run: |
          if [ -n "$(git status --porcelain src/ts/dist/)" ]; then
            echo "❌ The dist/ folder has uncommitted changes after running 'yarn build'"
            echo ""
            echo "The following files differ:"
            git status --short src/ts/dist/
            echo ""
            echo "Diff:"
            git diff src/ts/dist/
            echo ""
            echo "Please run 'yarn build' locally and commit the changes to the dist/ folder."
            exit 1
          else
            echo "✅ The dist/ folder matches the build output"
          fi
