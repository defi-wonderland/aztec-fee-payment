name: Verify dist folder

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-dist:
    name: Verify dist folder matches build output
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: ./.github/actions/setup-aztec
        with:
          start-pxe: 'false'
          run-codegen: 'true'

      - name: Build package
        run: yarn workspace @defi-wonderland/aztec-fee-payment build && yarn lint:prettier

      - name: Check for dist folder changes
        run: |
          if [ -n "$(git status --porcelain src/ts/dist/)" ]; then
            echo "❌ The dist/ folder has uncommitted changes after running 'yarn build'"
            echo ""
            echo "The following files differ:"
            git status --short src/ts/dist/
            echo ""
            echo "Diff:"
            git diff src/ts/dist/
            echo ""
            echo "Please run 'yarn build' locally and commit the changes to the dist/ folder."
            exit 1
          else
            echo "✅ The dist/ folder matches the build output"
          fi
